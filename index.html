<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curriculum Compass</title>
  <meta name="description" content="Unofficial overview of the FH Salzburg curricula, tailored to your major, with your electives saved in your browser.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14151f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main" data-l10n="a11y.skip">Skip to content</a>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menu-btn" type="button" data-l10n-attr="aria-label:nav.showDepartments" aria-expanded="false" aria-controls="side"></button>
    <a class="brand" href="#/" data-l10n-attr="aria-label:app.home">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="15" fill="var(--accent)"/>
        <path d="M16 6.5l3.2 9.5L16 25.5l-3.2-9.5z" fill="#fff"/>
        <path d="M16 16h3.2L16 25.5z" fill="#fff" fill-opacity=".5"/>
      </svg>
      <span>Curriculum Compass</span>
    </a>
    <div class="search" id="search-box">
      <label class="search-field">
        <span class="search-icon" aria-hidden="true"></span>
        <input id="search" type="search" autocomplete="off" data-l10n-attr="placeholder:search.placeholder;aria-label:search.label"
               role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list">
      </label>
      <div class="search-results" id="search-results" role="listbox"></div>
    </div>
    <span class="status-ico saved" id="saved" tabindex="0" role="img" data-tip="saved" data-l10n-attr="aria-label:status.savedLabel"></span>
  </header>

  <div class="shell">
    <nav class="side" id="side" data-l10n-attr="aria-label:nav.departments"></nav>
    <div class="scrim" id="scrim" aria-hidden="true"></div>

    <main class="main" id="main" tabindex="-1">
      <!-- Start: pick a department and programme -->
      <section class="home" id="home" hidden aria-labelledby="home-title">
        <h1 id="home-title" data-l10n="home.title">What do you study?</h1>
        <p class="subtitle" data-l10n="home.lead"></p>
        <div class="home-stage" id="home-stage"></div>
      </section>

      <div id="page" hidden>
        <div class="title-row">
          <h1 id="title">&nbsp;</h1>
          <button class="icon-btn info" id="prog-info" type="button" data-tip="programme" data-l10n-attr="aria-label:prog.about"></button>
          <button class="icon-btn info" id="share" type="button" data-tip="text" data-touch-silent data-l10n-attr="aria-label:prog.share;data-text:prog.share"></button>
        </div>
        <p class="subtitle" id="subtitle"></p>
        <div class="notes-slot" id="notes-slot"></div>

        <div id="pickers"></div>

        <section class="overview" id="overview" aria-label="Semesters"></section>
        <p class="picks-info" id="picks-info"></p>

        <div id="semesters"></div>

        <footer class="foot">
          <p id="source"></p>
          <p data-l10n="foot.disclaimer"></p>
          <p id="report"></p>
          <p><a id="json-link" href="data/index.json" data-l10n="foot.json">Download the data as JSON</a></p>
        </footer>
      </div>
    </main>
  </div>

  <dialog class="feedback" id="feedback" aria-labelledby="fb-title">
    <form id="fb-form" novalidate>
      <div class="fb-head">
        <h2 id="fb-title">Report a problem</h2>
        <div class="fb-kind" role="group"><span class="ink" aria-hidden="true"></span>
          <button type="button" data-kind="bug" data-l10n="fb.kindBug">Problem</button>
          <button type="button" data-kind="idea" data-l10n="fb.kindIdea">Idea</button>
        </div>
      </div>
      <label class="fb-label" for="fb-msg" data-l10n="fb.msgLabel">Your message</label>
      <textarea id="fb-msg" rows="5" maxlength="4000" required></textarea>
      <label class="fb-label" for="fb-mail" data-l10n="fb.mailLabel">Your e-mail (optional)</label>
      <input id="fb-mail" type="email" autocomplete="email">
      <input id="fb-bot" type="checkbox" tabindex="-1" autocomplete="off" class="fb-bot" aria-hidden="true">
      <label class="fb-check"><input id="fb-tech" type="checkbox" checked> <span data-l10n="fb.tech">Include technical details</span></label>
      <pre id="fb-ctx" class="fb-ctx"></pre>
      <p class="fb-note" data-l10n="fb.privacy"></p>
      <div class="fb-foot">
        <span id="fb-status" role="status" aria-live="polite"></span>
        <button type="button" class="fb-btn" id="fb-cancel" data-l10n="fb.cancel">Cancel</button>
        <button type="submit" class="fb-btn primary" data-l10n="fb.send">Send</button>
      </div>
      <div class="fb-done" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4 4L19 7"/></svg><span data-l10n="fb.thanks">Thank you!</span></div>
    </form>
  </dialog>

  <div class="tip" id="tip" role="tooltip"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
