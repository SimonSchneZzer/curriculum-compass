<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curriculum Compass</title>
  <meta name="description" content="Unofficial overview of the FH Salzburg curricula, tailored to your major, with your electives saved in your browser.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14151f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Show departments" aria-expanded="false" aria-controls="side"></button>
    <a class="brand" href="./" aria-label="Curriculum Compass, home">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="15" fill="var(--accent)"/>
        <path d="M16 6.5l3.2 9.5L16 25.5l-3.2-9.5z" fill="#fff"/>
        <path d="M16 16h3.2L16 25.5z" fill="#fff" fill-opacity=".5"/>
      </svg>
      <span>Curriculum Compass</span>
    </a>
    <div class="search" id="search-box">
      <label class="search-field">
        <span class="search-icon" aria-hidden="true"></span>
        <input id="search" type="search" placeholder="Search programmes" autocomplete="off" aria-label="Search programmes"
               role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list">
      </label>
      <div class="search-results" id="search-results" role="listbox" aria-label="Programmes"></div>
    </div>
    <span class="status-ico saved" id="saved" tabindex="0" role="img" data-tip="saved" aria-label="Saved in this browser"></span>
  </header>

  <div class="shell">
    <nav class="side" id="side" aria-label="Departments"></nav>
    <div class="scrim" id="scrim" aria-hidden="true"></div>

    <main class="main" id="main">
      <div id="page">
        <div class="title-row">
          <h1 id="title">&nbsp;</h1>
          <button class="icon-btn info" id="prog-info" type="button" data-tip="programme" aria-label="About this programme"></button>
        </div>
        <p class="subtitle" id="subtitle"></p>
        <div class="notes-slot" id="notes-slot"></div>

        <div id="pickers"></div>

        <section class="overview" id="overview" aria-label="Semesters"></section>
        <p class="picks-info" id="picks-info"></p>

        <div id="semesters"></div>

        <footer class="foot">
          <p id="source"></p>
          <p>Curriculum Compass is an unofficial overview and not a service of FH Salzburg. If anything here differs from the official study regulations, the regulations apply.</p>
          <p><a id="json-link" href="data/index.json">Download the data as JSON</a></p>
        </footer>
      </div>
    </main>
  </div>

  <div class="tip" id="tip" role="tooltip"></div>

  <script src="app.js"></script>
</body>
</html>
