# compass-web: the static app, plus /api/ → compass-ask (the AI behind "/" in the search). Caddy strips /compass,
# so these paths are relative to the app. Copied to ~/compass/ by ~/compass/deploy.sh.
server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;
    location /api/ {
        proxy_pass http://compass-ask:8080;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_read_timeout 60s;
        client_max_body_size 8k;
        add_header Cache-Control "no-store" always;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
